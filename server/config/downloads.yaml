# Database / binary download catalogue for the DARKHELIX backlog.
#
# TODO.md's "Blocked — missing database or binary" section says WHAT is
# missing; it does not say where to get it. This file is the missing half, and
# it is deliberately a tracked file rather than part of the gitignored
# server.yaml: a URL is a fact worth reviewing in a diff.
#
# Nothing here is trusted on sight. Every `url` is checked live (an HTTP HEAD
# from snarf) before the HUD offers it, and an entry whose URL does not answer
# 200 is shown as unavailable rather than filed -- a card carrying a dead URL
# costs an hour of somebody's afternoon. A blocked item with no entry at all is
# listed as "needs a URL", which is an honest state and the thing to fix here.
#
# Fields:
#   match    case-insensitive substring matched against the TODO item's text
#   dest     where it lands on snarf. Under /ssdpool/DARKHELIX/database/ is the
#            shared pool -- see docs/PIPELINE-VERIFICATION.md on what that means
#   archive  set when the download is a tarball that has to be unpacked
#   wire_in  what still has to be done after the bytes land. Downloads are
#            rarely the whole job: most of these need an edit to conform to the
#            format the pipeline actually reads.
entries:
  - id: gtdbtk
    match: "GTDB-Tk reference package"
    name: GTDB-Tk reference package
    url: https://data.gtdb.ecogenomic.org/releases/latest/auxillary_files/gtdbtk_package/full_package/gtdbtk_data.tar.gz
    dest: /ssdpool/DARKHELIX/database/gtdbtk
    archive: tar.gz
    approx: ~110 GB unpacked
    wire_in: >-
      Unpack, then point gd_gtdbtk_db at the release directory (the one holding
      taxonomy/, fastani/, markers/). genome_discovery.py skips gd_run_gtdbtk by
      design while it is unset, so the step is silently absent until this lands.

  - id: mash-refseq
    match: "mash sketch DB"
    name: Mash RefSeq sketch (k21, s1000)
    url: https://gembox.cbcb.umd.edu/mash/refseq.genomes.k21s1000.msh
    dest: /ssdpool/DARKHELIX/database/mash/refseq.genomes.k21s1000.msh
    approx: ~700 MB
    wire_in: >-
      DoMashPrefilter takes the .msh path directly. The lane has never been
      exercised, so expect the first run to be the real test of the wiring, not
      of the sketch.

  # PathoFact 2.0's core database serves two blocked items -- the toxin profile
  # set and the DB half of the pathofact entry -- so it appears twice, with
  # different destinations and different wire-in work. Verified 2026-09-03:
  # HTTP 200, 1,144,511,329 bytes. The md5 is Zenodo's own for the record.
  - id: pathofact2-db
    match: "PathoFact2 broad toxin profile set"
    name: PathoFact 2.0 core database (toxin + VF HMM profiles)
    url: https://zenodo.org/records/14192463/files/DATABASES.tar.gz?download=1
    dest: /ssdpool/DARKHELIX/database/toxin_hmm/pathofact2
    archive: tar.gz
    md5: acb950e7994c561311a0a6ec36caa701
    approx: 1.1 GB compressed
    wire_in: >-
      The archive carries PathoFact 2.0's HMM profiles for toxins and virulence
      factors plus cddid_all.tbl and its ML models -- it is not a single .hmm
      file. Extract, then build the broad profile set the pipeline expects at
      database/toxin_hmm/pathofact_broad.hmm from the toxin profiles inside it.
      Opt-in, server tier: do not turn it on for the edge build.

  - id: pathofact-db
    match: "pathofact` binary + DB"
    name: PathoFact 2.0 database (the DB half of DoToxinPathofact)
    url: https://zenodo.org/records/14192463/files/DATABASES.tar.gz?download=1
    dest: /ssdpool/DARKHELIX/database/pathofact
    archive: tar.gz
    md5: acb950e7994c561311a0a6ec36caa701
    approx: 1.1 GB compressed
    wire_in: >-
      This unblocks the DB half only. The `pathofact` binary is a Snakemake
      pipeline install from gitlab.lcsb.uni.lu/ESB/PathoFact2, not a file to
      fetch, so DoToxinPathofact stays blocked until that is installed too --
      file it as ordinary work, not as a download.

  # The TODO item says "~tens of MB"; the real file is 196 kB. Recorded as
  # measured rather than as remembered.
  - id: conoserver-protein
    match: "ConoServer / ConoDictor DB"
    name: ConoServer conopeptide protein sequences
    url: https://www.conoserver.org/download/conoserver_protein.fa.gz
    dest: /ssdpool/DARKHELIX/database/conoserver/conoserver_protein.fa.gz
    approx: 196 kB gzipped (the TODO's "~tens of MB" is wrong)
    wire_in: >-
      This is the ConoServer SEQUENCE set. ConoDictor's own HMM/PSSM models are
      not published as a separate download -- they come with the tool
      (pip install conodictor) -- so check which of the two DoPeptideToxin
      actually reads before wiring this in. Note the flag defaults True, so the
      lane is on by default and currently pointing at nothing.
